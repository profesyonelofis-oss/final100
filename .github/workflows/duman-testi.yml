name: Duman testi

# hizli_test.py kendi gecici veritabanini kurar, Flask sunucusunu ayaga kaldirir,
# tum ana akisi (kurulum, giris, alim/gider/teslimat, rapor, logo, veri klasoru)
# test eder ve kapanir. Gercek data/ klasoruna dokunmaz.
#
# Test, sunucuyu proje ici .venv icindeki yorumlayiciyla baslatir; sanal ortam
# yoksa kendi Python'unu kullanir. Bu yuzden Windows ve Linux'ta ayni sekilde
# kosar; CI daha hizli olan ubuntu calistiricisinda kosuyor.

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  duman-testi:
    name: Uctan uca duman testi
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Depoyu al
        uses: actions/checkout@v7

      - name: Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Sanal ortam + bagimliliklar
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Duman testini kos
        run: .venv/bin/python hizli_test.py
